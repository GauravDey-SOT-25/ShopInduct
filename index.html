<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ShopInduct — Experience premium, minimal e-commerce. Discover high-res electronics, bespoke fashion items, and designer home accessories with instant catalog search, drag-and-drop checkout, and elegant dark mode.">
  <title>ShopInduct</title>
  
  <!-- Premium Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <!-- Tailwind v4 browser-compliant inline theme customizer block -->
  <style type="tailwindcss">
    @theme {
      
      --color-primary: var(--primary-color);
      --color-primary-hover: var(--primary-hover);
      --color-primary-light: var(--primary-light);

      --color-accent: var(--accent-color);

      --color-background: var(--bg-color);
      --color-background-secondary: var(--bg-darker);
      --color-background-overlay: var(--bg-overlay);

      --color-surface: var(--card-bg);
      --color-surface-hover: var(--card-hover);

      --color-text-primary: var(--text-primary);
      --color-text-secondary: var(--text-secondary);
      --color-text-muted: var(--text-muted);
      --color-text-inverse: var(--text-inverse);

      --color-border: var(--border-color);
      --color-border-hover: var(--border-hover);

      --color-success: var(--success-color);

      --color-danger: var(--error-color);

      --color-rating: var(--accent-color);
      --color-badge: var(--primary-color);
      --color-badge-text: var(--text-inverse);

      --color-overlay-dark: var(--overlay-dark);
      --color-constant-white: var(--constant-white);
      --color-constant-dark: var(--constant-dark);
    }
  </style>

  <link rel="stylesheet" href="theme.css" />
</head>
<body class="bg-background text-text-primary transition-colors duration-250 min-h-screen flex flex-col font-sans antialiased">

  <header id="header-container"></header>

  <main id="app"></main>

  <footer id="footer-container"></footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
